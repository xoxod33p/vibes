services:
  vibes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    container_name: vibes-music-player
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=5000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    volumes:
      # Persistent storage for audio files, album covers, and transcode cache
      - ./uploads:/app/uploads
      - ./public/covers:/app/public/covers
      - ./cache:/app/cache
      # Optional: Uncomment if using a local cookies file or Firebase key
      # - ./cookies.txt:/app/cookies.txt:ro
      # - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/songs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
